name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Satu deploy dalam satu waktu; deploy berikutnya antre (tidak membatalkan).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STACK: eventix-be # -> ~/stacks/eventix-be di VPS

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ke VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY ada di
    # Settings > Environments > production.
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy

      # deploy/compose.yaml -> ~/stacks/eventix-be/compose.yaml
      - name: Salin compose.yaml ke VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/compose.yaml
          target: /home/${{ secrets.VPS_USER }}/stacks/${{ env.STACK }}
          strip_components: 1
          overwrite: true

      - name: Pull image, migrasi, restart
        uses: appleboy/ssh-action@v1
        env:
          # Dikirim sebagai env var (bukan diinterpolasi ke script) supaya token
          # tidak muncul di process list VPS. GITHUB_TOKEN kedaluwarsa begitu job
          # selesai.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          STACK: ${{ env.STACK }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,APP_IMAGE,STACK
          script: |
            set -euo pipefail
            cd "$HOME/stacks/$STACK"
            test -f .env || { echo "✗ $PWD/.env belum dibuat (lihat .env.example)"; exit 1; }

            # Image di-pin ke commit SHA: deploy deterministik, rollback cukup
            # dengan re-run workflow commit lama.
            APP_IMAGE=$(echo "$APP_IMAGE" | tr '[:upper:]' '[:lower:]')
            export APP_IMAGE
            echo "→ Image: $APP_IMAGE"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            echo "→ Pull image"
            docker compose pull app

            echo "→ Pastikan Postgres & Redis sehat"
            docker compose up -d --wait postgres redis

            echo "→ Migrasi Prisma (sebelum app diganti)"
            docker compose run --rm --no-deps app npx prisma migrate deploy

            echo "→ Restart app & tunggu healthy"
            if ! docker compose up -d --remove-orphans --wait --wait-timeout 180; then
              echo "✗ App tidak healthy. Log terakhir:"
              docker compose logs --tail 80 app
              exit 1
            fi

            docker image prune -f
            echo "✓ Deploy selesai"
