# .github/workflows/deploy.yml
name: CI/CD Pipeline

on:
  push:
    branches:
      - main      # hanya trigger saat push ke main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # otomatis: username/wartiket

jobs:
  # ==============================
  # JOB 1: Test
  # ==============================
  test:
  
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Jalankan lint
        run: npm run lint

      - name: Jalankan unit test
        run: npm run test

  # ==============================
  # JOB 2: Build & Push Image
  # ==============================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test        # hanya jalan jika test berhasil
    
    permissions:
      contents: read
      packages: write  # izin push ke GHCR

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata untuk Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-        # tag berdasarkan commit hash
            type=raw,value=latest       # selalu update tag latest

      - name: Build dan push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production    # pakai stage production dari Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha  # cache layer Docker di GitHub Actions
          cache-to: type=gha,mode=max

  # ==============================
  # JOB 3: Deploy ke VPS
  # ==============================
  deploy:
    name: Deploy ke VPS
    runs-on: ubuntu-latest
    needs: build       # hanya jalan jika build berhasil

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/wartiket/app

            # Login ke GHCR dari VPS
            echo ${{ secrets.GHCR_TOKEN }} | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull image terbaru
            docker compose -f docker-compose.prod.yml pull app

            # Restart hanya service app (zero-downtime lebih baik)
            docker compose -f docker-compose.prod.yml up -d --no-deps app

            # Bersihkan image lama yang tidak terpakai
            docker image prune -f

            echo "Deploy selesai!"