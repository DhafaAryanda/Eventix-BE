name: CI

on:
  pull_request:
    branches: [main]
  # Dipanggil juga oleh deploy.yml sebelum build image.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Hanya untuk `prisma generate`; tidak ada koneksi DB di CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # TODO: jadikan blocking setelah error ESLint bawaan (±89) dibereskan —
      # tugas pertama yang cocok untuk Hermes. Sementara hanya peringatan.
      - name: Lint
        run: npm run lint:check
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Unit test
        run: npm test -- --ci

      - name: Build
        run: npm run build
