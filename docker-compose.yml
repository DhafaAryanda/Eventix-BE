services:
  app:
    image: ${APP_IMAGE:-ghcr.io/dhafaaryanda/eventix-be:latest}
    container_name: eventix-be
    expose:
      - '4000'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Memakai /metrics (endpoint Prometheus, di luar prefix /api).
      # Lebih kuat daripada versi sebelumnya yang menembak /api dan menganggap
      # 404 sebagai "sehat": di sini status HARUS 200, jadi container baru
      # dinyatakan sehat kalau Nest benar-benar selesai bootstrap.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/metrics',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - shared-net
      - internal-net
      - infrastructure

  postgres:
    image: postgres:16-alpine
    container_name: eventix-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    container_name: eventix-redis
    command: redis-server --requirepass redispassword
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redispassword', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal-net

  # MinIO untuk DEVELOPMENT LOKAL saja — sengaja dinonaktifkan.
  #
  # Di VPS, MinIO berjalan sebagai stack bersama di /home/infrastructure dan
  # sudah mem-publish port 9000/9001. Mengaktifkan service ini di sana membuat
  # `docker compose up` gagal karena port bentrok. Service `app` sudah
  # tergabung ke network eksternal `infrastructure` untuk menjangkaunya.
  #
  # Untuk memakainya di lokal: uncomment blok ini DAN tambahkan
  # `minio_data:` di bawah `volumes:`.
  #
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - '9000:9000'
  #     - '9001:9001'
  #   environment:
  #     MINIO_ROOT_USER: admindhafa
  #     MINIO_ROOT_PASSWORD: alamak123
  #   volumes:
  #     - minio_data:/data

volumes:
  postgres_data:
  redis_data:

networks:
  shared-net:
    external: true
  internal-net:
    driver: bridge
  infrastructure:
    external: true
    name: infrastructure
