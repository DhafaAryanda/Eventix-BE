services:
  app:
    image: ${APP_IMAGE:-ghcr.io/dhafaaryanda/eventix-be:latest}
    container_name: eventix-be
    expose:
      - '4000'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # App tidak punya route /health; cukup pastikan HTTP server menjawab.
      # Respons apa pun (termasuk 404) berarti proses sudah listening.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api',r=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - shared-net
      - internal-net
      - infrastructure

  postgres:
    image: postgres:16-alpine
    container_name: eventix-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eventix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    container_name: eventix-redis
    command: redis-server --requirepass redispassword
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redispassword', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal-net

volumes:
  postgres_data:
  redis_data:

networks:
  shared-net:
    external: true
  internal-net:
    driver: bridge
  infrastructure:
    external: true
    name: infrastructure
